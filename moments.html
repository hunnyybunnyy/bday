        <section class="page-hero"><span class="eyebrow">03 / tiny surprises</span>

        <section class="notes-grid"><button class="note-card" data-modal-title="A tiny reminder"

                data-modal-body="God is watching! Take your time. Breathe. You are allowed to have a day that is simply a day without any kind of worries."><span>✉</span><strong>On
